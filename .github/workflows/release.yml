name: Build and publish macOS DMGs

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '可留空：按所选分支的 Info.plist 版本创建标签；填写时必须匹配源码版本'
        required: false
        type: string
      publish:
        description: '发布 GitHub Release（需配置更新签名 Secret）；关闭则仅编译四种 DMG'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: macos-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  metadata:
    if: github.event_name != 'push' || !github.event.deleted
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # Manual releases may create their missing version tag.
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      build: ${{ steps.meta.outputs.build }}
      commit: ${{ steps.meta.outputs.commit }}
      publish: ${{ steps.meta.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release scripts and source
        run: |
          python3 scripts/check-public-source.py --history HEAD
          python3 scripts/test-ci-release.py
      - name: Resolve version and prepare immutable release tag
        id: meta
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || '' }}
          PUSH_TAG: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          PUBLISH_RELEASE: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "publish=$PUBLISH_RELEASE" >> "$GITHUB_OUTPUT"
          if [ "$PUBLISH_RELEASE" != true ]; then
            python3 scripts/ci-release.py metadata --tag "$RELEASE_TAG" --build-only --github-output "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = workflow_dispatch ]; then
            python3 scripts/ci-release.py prepare --tag "$RELEASE_TAG" --github-output "$GITHUB_OUTPUT"
          else
            python3 scripts/ci-release.py metadata --tag "$PUSH_TAG" --github-output "$GITHUB_OUTPUT"
          fi

  build:
    needs: metadata
    name: DMG / ${{ matrix.flavor }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: legacy
            runner: macos-15-intel
          - flavor: compat
            runner: macos-15-intel
          - flavor: arm64
            runner: macos-15
          - flavor: intel
            runner: macos-15-intel
    env:
      # Swift 6 / macOS SDK 15.5; keeps the legacy Swift runtime available.
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.metadata.outputs.commit }}
      FLAVOR: ${{ matrix.flavor }}
      PUBLISH_RELEASE: ${{ needs.metadata.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check toolchain
        run: |
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          swift --version
          uname -m
      - name: Build application, run core checks and create DMG
        run: python3 scripts/package-release.py --flavor "$FLAVOR" --format dmg --test-core
      - name: Verify DMG payload, architectures and deployment targets
        run: python3 scripts/verify-installers.py --flavor "$FLAVOR" --format dmg
      - name: Stage the verified artifact
        run: |
          options=()
          if [ "$PUBLISH_RELEASE" != true ]; then options+=(--build-only); fi
          python3 scripts/ci-release.py stage --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT" --flavor "$FLAVOR" --output work/ci-output "${options[@]}"
      - name: Prepare signed in-app updates
        if: needs.metadata.outputs.publish == 'true' && (matrix.flavor == 'arm64' || matrix.flavor == 'legacy')
        env:
          OSHELL_UPDATE_SIGNING_KEY: ${{ secrets.OSHELL_UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "$OSHELL_UPDATE_SIGNING_KEY" ]; then
            echo '::error::Configure the existing OSHELL_UPDATE_SIGNING_KEY secret before publishing. A DMG-only Release breaks in-app update checks.'
            exit 1
          fi
          python3 -m venv work/update-signing
          work/update-signing/bin/python -m pip install -r scripts/requirements-release.txt
          work/update-signing/bin/python scripts/sign-ci-updates.py --flavor "$FLAVOR" --tag "$RELEASE_TAG"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: needs.metadata.outputs.publish == 'true' && (matrix.flavor == 'arm64' || matrix.flavor == 'legacy')
        with:
          name: updates-${{ matrix.flavor }}
          path: work/ci-updates/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dmg-${{ matrix.flavor }}
          path: work/ci-output/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Preserve build diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: diagnostics-${{ matrix.flavor }}
          path: |
            validation/package-*.log
            validation/package-*.json
          if-no-files-found: ignore
          retention-days: 7

  release:
    needs: [metadata, build]
    if: needs.metadata.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
      RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
      RELEASE_COMMIT: ${{ needs.metadata.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: dmg-*
          path: work/release-input
          merge-multiple: false
      - name: Export corresponding audited source
        run: python3 scripts/export-public-source.py --ref "$RELEASE_COMMIT" --output "dist/source/OShell-${RELEASE_VERSION}-source.tar.gz"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: updates-*
          path: work/update-input
          merge-multiple: false
      - name: Require four matching DMGs and prepare checksums
        run: |
          python3 scripts/ci-release.py collect --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT" \
            --artifacts work/release-input --updates-artifacts work/update-input --repository "$GITHUB_REPOSITORY" \
            --source "dist/source/OShell-${RELEASE_VERSION}-source.tar.gz" --output dist/github-release
      - name: Upload as draft, verify all assets, then publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci-release.py publish --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT" --output dist/github-release
